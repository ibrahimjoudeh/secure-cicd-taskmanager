name: secure-cicd-free-tier-ec2-deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: secure-cicd-taskmanager
  HEALTH_PATH: /health

jobs:
  lint-test-secret-scan:
    name: Lint, test, and scan repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest --cov=. --cov-report=term-missing

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-push-deploy:
    name: Build, Trivy scan, push to ECR, deploy to free-tier EC2
    runs-on: ubuntu-latest
    needs: lint-test-secret-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build \
            -t "$IMAGE" \
            -t "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest" \
            -f app/backend/Dockerfile app
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Push image to ECR
        run: |
          docker push "${{ steps.image.outputs.image }}"
          docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest"

      - name: Read EC2 deployment details from SSM Parameter Store
        id: target
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ssm get-parameter --name "/${ECR_REPOSITORY}/ec2_instance_id" --query "Parameter.Value" --output text)
          APP_URL=$(aws ssm get-parameter --name "/${ECR_REPOSITORY}/app_url" --query "Parameter.Value" --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy image to EC2 through AWS Systems Manager
        id: deploy
        run: |
          set -euo pipefail
          cat > ssm-commands.json <<EOF_CMDS
          {
            "commands": [
              "sudo /opt/taskmanager/deploy.sh '${{ steps.image.outputs.image }}'"
            ],
            "executionTimeout": ["900"]
          }
          EOF_CMDS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy secure-cicd-taskmanager image $GITHUB_SHA" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.target.outputs.instance_id }}"
          WAIT_CODE=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.target.outputs.instance_id }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          exit $WAIT_CODE

      - name: Post-deployment health check
        id: health
        run: |
          set -euo pipefail
          URL="${{ steps.target.outputs.app_url }}${HEALTH_PATH}"
          for i in {1..18}; do
            if curl -fsS "$URL"; then
              echo "Health check passed: $URL"
              exit 0
            fi
            echo "Waiting for health check... attempt $i"
            sleep 10
          done
          echo "Health check failed: $URL"
          exit 1

      - name: Roll back EC2 container on failed deployment
        if: failure()
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.target.outputs.instance_id }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "No instance ID available; rollback skipped."
            exit 0
          fi

          cat > rollback-commands.json <<EOF_CMDS
          {
            "commands": [
              "sudo /opt/taskmanager/rollback.sh"
            ],
            "executionTimeout": ["600"]
          }
          EOF_CMDS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback secure-cicd-taskmanager after failed deployment" \
            --parameters file://rollback-commands.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json || true
